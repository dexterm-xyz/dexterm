# After a human publishes a draft release: (1) publish the compiled `dexterm` package to npm with provenance,
# only when the repository variable NPM_PUBLISH is "true" (docs/npm-publish-shape.md: trusted publishing via
# OIDC; the one-time NPM_TOKEN secret exists only for the package's very first version); (2) hand
# scan-results.json to the website repo as a pull request, only when SITE_REPO is set. Both jobs are no-ops
# until those switches are flipped on purpose.
name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  npm:
    name: npm publish (trusted publishing, provenance)
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write   # OIDC token for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: npm >= 11.5.1 (required for trusted publishing)
        run: npm install -g npm@latest && npm --version
      - name: install + build the publishable package
        run: |
          npm ci
          if ! node -e "process.exit(require('./packages/cli/package.json').scripts?.build ? 0 : 1)"; then
            echo "::error::packages/cli has no build script yet (docs/npm-publish-shape.md). Not publishing."; exit 1
          fi
          npm run build --workspace packages/cli
      - name: "publish with provenance (OIDC trusted publisher; NPM_TOKEN only for the first version, then deleted)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace packages/cli --provenance --access public

  scan-results-to-site:
    name: hand scan-results.json to the website repo
    if: vars.SITE_REPO != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: download scan-results.json from the published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern scan-results.json --dir "$RUNNER_TEMP/sr"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ vars.SITE_REPO }}
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: site
      - name: open a pull request on the site repo (never a direct push)
        env:
          GH_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cd site
          cp "$RUNNER_TEMP/sr/scan-results.json" scan-results.json
          git config user.name "dexterm-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git checkout -b "scan-results/$TAG"
          git add scan-results.json
          git commit -m "scan-results.json for $TAG (from the release pipeline)"
          git push -u origin "scan-results/$TAG"
          gh pr create --title "trust page: scan results for $TAG" --body "Written by the release pipeline: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. The site build validates the file against the schema before it renders."
