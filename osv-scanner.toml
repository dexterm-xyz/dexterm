# Advisories CI accepts (ci.yml passes --config osv-scanner.toml). Each needs a reason and an expiry; anything
# else osv-scanner reports fails CI. The release's scan-results.json still lists these as findings.
#
# Both are in packages/popup/shell/wry/Cargo.lock: the optional native chart window, which dexterm does not ship
# prebuilt; it is compiled only on machines that opt in. Clearing them needs tao/wry/gtk upgrades (glib >= 0.20).

[[IgnoredVulns]]
